services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CS2_HUB_DATA_DIR: /data
      CS2_HUB_API_KEY: ${CS2_HUB_API_KEY:?Set CS2_HUB_API_KEY before starting the server}
      CS2_HUB_WEB_USERNAME: ${CS2_HUB_WEB_USERNAME:?Set CS2_HUB_WEB_USERNAME before starting the server}
      CS2_HUB_WEB_PASSWORD: ${CS2_HUB_WEB_PASSWORD:?Set CS2_HUB_WEB_PASSWORD before starting the server}
    volumes:
      - cs2-hub-data:/data
    networks:
      - npm_default

volumes:
  cs2-hub-data:

networks:
  npm_default:
    external: true
