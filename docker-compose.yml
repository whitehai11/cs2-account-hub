services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CS2_HUB_DATA_DIR: /data
      CS2_HUB_API_KEY: ${CS2_HUB_API_KEY:?Set CS2_HUB_API_KEY before starting the server}
      CS2_HUB_WEB_USERNAME: ${CS2_HUB_WEB_USERNAME:?Set CS2_HUB_WEB_USERNAME before starting the server}
      CS2_HUB_WEB_PASSWORD: ${CS2_HUB_WEB_PASSWORD:?Set CS2_HUB_WEB_PASSWORD before starting the server}
    volumes:
      - cs2-hub-data:/data
    networks:
      - npm_default

volumes:
  cs2-hub-data:

networks:
  npm_default:
    external: true
