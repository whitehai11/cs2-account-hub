services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CS2_HUB_DATA_DIR: /data
      CS2_HUB_API_KEY: ${CS2_HUB_API_KEY:?Set CS2_HUB_API_KEY before starting the server}
    volumes:
      - cs2-hub-data:/data

volumes:
  cs2-hub-data:
