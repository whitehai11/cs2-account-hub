services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CS2_HUB_DATA_DIR: /data
      CS2_HUB_API_KEY: ${CS2_HUB_API_KEY:?Set CS2_HUB_API_KEY before starting the server}
      CS2_HUB_WEB_USERNAME: ${CS2_HUB_WEB_USERNAME:?Set CS2_HUB_WEB_USERNAME before starting the server}
      CS2_HUB_WEB_PASSWORD: ${CS2_HUB_WEB_PASSWORD:?Set CS2_HUB_WEB_PASSWORD before starting the server}
      CS2_HUB_DISCORD_WEBHOOK_URL: ${CS2_HUB_DISCORD_WEBHOOK_URL:-}
      CS2_HUB_CHECK_INTERVAL_MINUTES: ${CS2_HUB_CHECK_INTERVAL_MINUTES:-30}
      CS2_HUB_IMAP_HOST: ${CS2_HUB_IMAP_HOST:-}
      CS2_HUB_IMAP_PORT: ${CS2_HUB_IMAP_PORT:-993}
      CS2_HUB_IMAP_USERNAME: ${CS2_HUB_IMAP_USERNAME:-}
      CS2_HUB_IMAP_PASSWORD: ${CS2_HUB_IMAP_PASSWORD:-}
      CS2_HUB_IMAP_FOLDER: ${CS2_HUB_IMAP_FOLDER:-INBOX}
      CS2_HUB_IMAP_SENDERS: ${CS2_HUB_IMAP_SENDERS:-}
      CS2_HUB_IMAP_SENDERS_SECONDARY: ${CS2_HUB_IMAP_SENDERS_SECONDARY:-}
      CS2_HUB_IMAP_PRIMARY_LABEL: ${CS2_HUB_IMAP_PRIMARY_LABEL:-Steam}
      CS2_HUB_IMAP_SECONDARY_LABEL: ${CS2_HUB_IMAP_SECONDARY_LABEL:-Zweite Domain}
      CS2_HUB_IMAP_RETENTION_DAYS: ${CS2_HUB_IMAP_RETENTION_DAYS:-30}
      CS2_HUB_IMAP_SYNC_SECONDS: ${CS2_HUB_IMAP_SYNC_SECONDS:-300}
    volumes:
      - cs2-hub-data:/data
    networks:
      - npm_default

volumes:
  cs2-hub-data:

networks:
  npm_default:
    external: true
